description = "Model generation, Core ML conversion and parity checks for the Parakeet iOS benchmark (see ../DESIGN.md)"
requires-python = "==3.12.*"
dependencies = [
    "coremltools==9.0",
    "torch==2.7.1",
    "numpy>=1.26,<2.3",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "pyyaml>=6",
]

[tool.uv]
package = false
